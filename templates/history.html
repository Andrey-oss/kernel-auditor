{% extends 'base.html' %}

{% block title %}Audit History{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">System Change History</h1>
    
    <!-- Filters -->
    <div class="row mb-3">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="categoryFilter">
                                <option value="">All Categories</option>
                                <option value="profile">Profile</option>
                                <option value="sysctl">Sysctl</option>
                                <option value="cpu">CPU</option>
                                <option value="scheduler">Scheduler</option>
                                <option value="network">Network</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="statusFilter">
                                <option value="">All Status</option>
                                <option value="success">Success</option>
                                <option value="error">Error</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Items per page</label>
                            <select class="form-select" id="perPageFilter">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Logs Table -->
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Category</th>
                                    <th>Action</th>
                                    <th>Parameter</th>
                                    <th>Old Value</th>
                                    <th>New Value</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                                <tr>
                                    <td colspan="7" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <nav aria-label="Page navigation" class="mt-3">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentCategory = '';
let currentStatus = '';
let currentPerPage = 20;

function loadLogs() {
    const url = new URL('/api/audit_logs', window.location.origin);
    url.searchParams.append('page', currentPage);
    url.searchParams.append('per_page', currentPerPage);
    if (currentCategory) url.searchParams.append('category', currentCategory);
    if (currentStatus) url.searchParams.append('status', currentStatus);
    
    fetch(url)
        .then(r => r.json())
        .then(data => {
            displayLogs(data.items);
            displayPagination(data.pagination);
        });
}

function displayLogs(logs) {
    const tbody = document.getElementById('logsTableBody');
    
    if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No logs found</td></tr>';
        return;
    }
    
    let html = '';
    logs.forEach(log => {
        const statusClass = log.status === 'error' ? 'text-danger' : 'text-success';
        html += `
            <tr>
                <td>${log.timestamp}</td>
                <td><span class="badge bg-secondary">${log.category || '-'}</span></td>
                <td>${log.action}</td>
                <td><small>${log.parameter || '-'}</small></td>
                <td><small class="text-muted">${log.old_value || '-'}</small></td>
                <td><small class="text-primary">${log.new_value || '-'}</small></td>
                <td><span class="badge ${statusClass}">${log.status}</span></td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

function displayPagination(pagination) {
    const paginationEl = document.getElementById('pagination');
    let html = '';
    
    // Previous button
    html += `
        <li class="page-item ${!pagination.has_prev ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${pagination.prev_page || 1})">Previous</a>
        </li>
    `;
    
    // Page numbers
    for (let i = 1; i <= pagination.pages; i++) {
        if (
            i === 1 || 
            i === pagination.pages || 
            (i >= pagination.page - 2 && i <= pagination.page + 2)
        ) {
            html += `
                <li class="page-item ${i === pagination.page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
        } else if (i === pagination.page - 3 || i === pagination.page + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }
    
    // Next button
    html += `
        <li class="page-item ${!pagination.has_next ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${pagination.next_page || pagination.page})">Next</a>
        </li>
    `;
    
    paginationEl.innerHTML = html;
    
    // Update total info
    const totalInfo = document.createElement('div');
    totalInfo.className = 'text-center text-muted mt-2';
    totalInfo.innerHTML = `Showing ${(pagination.page - 1) * pagination.per_page + 1} - 
        ${Math.min(pagination.page * pagination.per_page, pagination.total)} of ${pagination.total} entries`;
    
    const oldInfo = document.getElementById('pagination-info');
    if (oldInfo) oldInfo.remove();
    
    totalInfo.id = 'pagination-info';
    paginationEl.parentNode.appendChild(totalInfo);
}

function changePage(page) {
    currentPage = page;
    loadLogs();
}

// Filter event listeners
document.getElementById('categoryFilter').addEventListener('change', function() {
    currentCategory = this.value;
    currentPage = 1;
    loadLogs();
});

document.getElementById('statusFilter').addEventListener('change', function() {
    currentStatus = this.value;
    currentPage = 1;
    loadLogs();
});

document.getElementById('perPageFilter').addEventListener('change', function() {
    currentPerPage = parseInt(this.value);
    currentPage = 1;
    loadLogs();
});

// Auto-refresh every 30 seconds
loadLogs();
setInterval(loadLogs, 30000);
</script>

<style>
.table td {
    vertical-align: middle;
}
.badge {
    font-size: 0.8rem;
}
</style>
{% endblock %}
