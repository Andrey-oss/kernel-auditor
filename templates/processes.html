{% extends 'base.html' %}

{% block title %}Running Processes{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center my-5">
        Running Processes
        <span class="small text-muted ms-3" id="lastUpdate"></span>
        <span class="badge bg-primary ms-2" id="process-count"></span>
    </h1>

    <!-- Filters -->
    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" class="form-control" id="search-process" 
                   placeholder="🔍 Search by name or PID...">
        </div>
        <div class="col-md-3">
            <select class="form-select" id="sort-process">
                <option value="name">Sort by Name</option>
                <option value="cpu">Sort by CPU (high to low)</option>
                <option value="memory">Sort by Memory (high to low)</option>
                <option value="pid">Sort by PID</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-outline-primary w-100" onclick="loadProcesses(true)">
                🔄 Refresh
            </button>
        </div>
        <div class="col-md-3 text-end">
            <span class="text-muted" id="filter-count"></span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered text-center">
            <thead class="thead-dark">
                <tr>
                    <th>PID</th>
                    <th>Name</th>
                    <th>CPU Usage (%)</th>
                    <th>Memory (MB)</th>
                    <th>Status</th>
                    <th>Started</th>
                </tr>
            </thead>
            <tbody id="processes-tbody">
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        <div class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        Loading processes...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav aria-label="Process navigation" class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<script>
// Global variables
let refreshInterval;
let allProcesses = [];
let filteredProcesses = [];
let currentPage = 1;
let itemsPerPage = 20;

// Load data on start
document.addEventListener('DOMContentLoaded', function() {
    loadProcesses();
    startAutoRefresh();
    
    // Load saved page from session storage
    const savedPage = sessionStorage.getItem('processes_current_page');
    if (savedPage) {
        currentPage = parseInt(savedPage);
    }
    
    // Load saved search from session storage
    const savedSearch = sessionStorage.getItem('processes_search');
    if (savedSearch) {
        document.getElementById('search-process').value = savedSearch;
    }
    
    // Load saved sort from session storage
    const savedSort = sessionStorage.getItem('processes_sort');
    if (savedSort) {
        document.getElementById('sort-process').value = savedSort;
    }
    
    // Event listeners
    document.getElementById('search-process').addEventListener('input', function() {
        sessionStorage.setItem('processes_search', this.value);
        filterProcesses();
    });
    
    document.getElementById('sort-process').addEventListener('change', function() {
        sessionStorage.setItem('processes_sort', this.value);
        filterProcesses();
    });
});

// ========== LOAD PROCESSES ==========
function loadProcesses(resetPage = false) {
    if (resetPage) {
        currentPage = 1;
        sessionStorage.setItem('processes_current_page', '1');
    }
    
    fetch('/api/processes')
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                console.error('Error:', data.error);
                showError('Failed to load processes');
                return;
            }
            
            allProcesses = data;
            filterProcesses(false); // Don't reset page on auto-refresh
            updateLastUpdateTime();
            updateProcessCount(allProcesses.length);
        })
        .catch(error => {
            console.error('Error loading processes:', error);
            showError('Failed to load processes');
        });
}

// ========== FILTER AND SORT ==========
function filterProcesses(resetPage = true) {
    const searchTerm = document.getElementById('search-process').value.toLowerCase();
    const sortBy = document.getElementById('sort-process').value;
    
    // Filter
    filteredProcesses = allProcesses.filter(proc => {
        return (proc.name && proc.name.toLowerCase().includes(searchTerm)) || 
               (proc.pid && proc.pid.toString().includes(searchTerm));
    });
    
    // Sort
    switch(sortBy) {
        case 'cpu':
            filteredProcesses.sort((a, b) => (b.cpu_percent || 0) - (a.cpu_percent || 0));
            break;
        case 'memory':
            filteredProcesses.sort((a, b) => (b.memory || 0) - (a.memory || 0));
            break;
        case 'pid':
            filteredProcesses.sort((a, b) => (a.pid || 0) - (b.pid || 0));
            break;
        default: // name
            filteredProcesses.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    }
    
    document.getElementById('filter-count').textContent = 
        `Showing ${filteredProcesses.length} of ${allProcesses.length} processes`;
    
    // Reset to first page only if requested and if current page is out of bounds
    if (resetPage) {
        currentPage = 1;
    } else {
        // Check if current page is still valid
        const maxPage = Math.ceil(filteredProcesses.length / itemsPerPage);
        if (currentPage > maxPage && maxPage > 0) {
            currentPage = maxPage;
        }
    }
    
    sessionStorage.setItem('processes_current_page', currentPage.toString());
    displayProcesses();
}

// ========== DISPLAY PROCESSES ==========
function displayProcesses() {
    const tbody = document.getElementById('processes-tbody');
    
    if (filteredProcesses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No processes found</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    
    // Pagination
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageProcesses = filteredProcesses.slice(start, end);
    
    let html = '';
    pageProcesses.forEach(proc => {
        const cpuClass = getCpuClass(proc.cpu_percent);
        const memoryClass = getMemoryClass(proc.memory);
        const statusClass = getStatusClass(proc.status);
        
        html += `
            <tr>
                <td><strong>${proc.pid || 'N/A'}</strong></td>
                <td>${proc.name || 'N/A'}</td>
                <td class="${cpuClass}">${proc.cpu_percent ? proc.cpu_percent.toFixed(1) : '0'}%</td>
                <td class="${memoryClass}">${proc.memory || 0} MB</td>
                <td><span class="badge ${statusClass}">${proc.status || 'unknown'}</span></td>
                <td>${proc.started || 'N/A'}</td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
    displayPagination();
}

// ========== PAGINATION ==========
function displayPagination() {
    const totalPages = Math.ceil(filteredProcesses.length / itemsPerPage);
    const pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    
    // Previous button
    html += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">Previous</a>
        </li>
    `;
    
    // Page numbers
    for (let i = 1; i <= totalPages; i++) {
        if (
            i === 1 || 
            i === totalPages || 
            (i >= currentPage - 2 && i <= currentPage + 2)
        ) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                </li>
            `;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
    }
    
    // Next button
    html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">Next</a>
        </li>
    `;
    
    pagination.innerHTML = html;
}

function changePage(page) {
    if (page < 1) return;
    
    const totalPages = Math.ceil(filteredProcesses.length / itemsPerPage);
    if (page > totalPages) return;
    
    currentPage = page;
    sessionStorage.setItem('processes_current_page', currentPage.toString());
    displayProcesses();
}

// ========== AUTO-REFRESH ==========
function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
        // Pass false to NOT reset page on auto-refresh
        loadProcesses(false);
    }, 3000);
}

function stopAutoRefresh() {
    if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
    }
}

// ========== HELPER FUNCTIONS ==========

function updateLastUpdateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString();
    document.getElementById('lastUpdate').textContent = `🕐 Updated: ${timeStr}`;
}

function updateProcessCount(count) {
    document.getElementById('process-count').textContent = `${count} processes`;
}

function getCpuClass(cpuPercent) {
    if (!cpuPercent) return '';
    if (cpuPercent > 50) return 'text-danger fw-bold';
    if (cpuPercent > 25) return 'text-warning';
    return 'text-success';
}

function getMemoryClass(memoryMB) {
    if (!memoryMB) return '';
    if (memoryMB > 500) return 'text-danger fw-bold';
    if (memoryMB > 200) return 'text-warning';
    return 'text-success';
}

function getStatusClass(status) {
    const statusClasses = {
        'running': 'bg-success',
        'sleeping': 'bg-info',
        'stopped': 'bg-warning',
        'zombie': 'bg-danger',
        'idle': 'bg-secondary',
        'waiting': 'bg-primary',
        'locked': 'bg-dark'
    };
    return statusClasses[status] || 'bg-secondary';
}

function showError(message) {
    const toast = document.createElement('div');
    toast.className = 'position-fixed bottom-0 end-0 p-3';
    toast.style.zIndex = '5';
    toast.innerHTML = `
        <div class="toast show" role="alert">
            <div class="toast-header bg-danger text-white">
                <strong class="me-auto">Error</strong>
                <button type="button" class="btn-close btn-close-white" onclick="this.closest('.toast').remove()"></button>
            </div>
            <div class="toast-body">${message}</div>
        </div>
    `;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        if (toast.parentNode) toast.remove();
    }, 5000);
}

// Pause on hover
document.getElementById('processes-tbody').addEventListener('mouseenter', stopAutoRefresh);
document.getElementById('processes-tbody').addEventListener('mouseleave', startAutoRefresh);

// Clear on exit
window.addEventListener('beforeunload', function() {
    stopAutoRefresh();
});
</script>

<style>
/* Additional styles */
.table td {
    vertical-align: middle;
    font-size: 14px;
}

.table th {
    background-color: #343a40;
    color: white;
}

#lastUpdate {
    font-size: 0.9rem;
    font-weight: normal;
}

.badge {
    font-size: 0.8rem;
    padding: 5px 8px;
}

.text-success { color: #28a745 !important; }
.text-warning { color: #ffc107 !important; }
.text-danger { color: #dc3545 !important; }

.fw-bold {
    font-weight: 700;
}

/* Animation for new rows */
@keyframes highlight {
    0% { background-color: #fff3cd; }
    100% { background-color: transparent; }
}

tr {
    animation: highlight 1s;
}

/* Search and filters */
.form-control:focus, .form-select:focus {
    border-color: #80bdff;
    box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
}

/* Pagination */
.pagination {
    margin-bottom: 0;
}

.page-link {
    color: #007bff;
    cursor: pointer;
}

.page-item.active .page-link {
    background-color: #007bff;
    border-color: #007bff;
    color: white;
}

.page-item.disabled .page-link {
    cursor: not-allowed;
}
</style>
{% endblock %}
